<div class="container-fluid mt-4">
    <div class="card">
      <div class="card-header bg-primary text-white">
        <h2>Products Table</h2>
        <p class="mb-0">PrimeNG Table with Bootstrap Styling</p>
      </div>
      <div class="card-body">
        <!-- Search and Clear Controls -->
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text"><i class="pi pi-search"></i></span>
              <input 
                type="text" 
                class="form-control" 
                placeholder="Search products..." 
                [(ngModel)]="globalFilterValue"
                (input)="dt.filterGlobal(globalFilterValue, 'contains')"
              >
            </div>
          </div>
          <div class="col-md-6 d-flex justify-content-end">
            <p-button 
              label="Clear" 
              icon="pi pi-filter-slash" 
              styleClass="p-button-outlined p-button-danger"
              (onClick)="clear(dt)"
            ></p-button>
          </div>
        </div>
        
        <!-- PrimeNG Table with Bootstrap classes -->
        <p-table 
          #dt 
          [value]="products" 
          [paginator]="true" 
          [rows]="5" 
          [showCurrentPageReport]="true" 
          [tableStyle]="{ 'min-width': '100%' }"
          [globalFilterFields]="['name', 'category', 'status']"
          currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
          styleClass="table table-striped"
          responsiveLayout="scroll"
        >
          <ng-template pTemplate="header">
            <tr class="table-primary">
              <th pSortableColumn="id" style="width:10%">ID <p-sortIcon field="id"></p-sortIcon></th>
              <th pSortableColumn="name" style="width:25%">Name <p-sortIcon field="name"></p-sortIcon></th>
              <th pSortableColumn="price" style="width:15%">Price <p-sortIcon field="price"></p-sortIcon></th>
              <th pSortableColumn="category" style="width:20%">Category <p-sortIcon field="category"></p-sortIcon></th>
              <th pSortableColumn="status" style="width:15%">Status <p-sortIcon field="status"></p-sortIcon></th>
              <th pSortableColumn="quantity" style="width:15%">Quantity <p-sortIcon field="quantity"></p-sortIcon></th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-product>
            <tr>
              <td>{{product.id}}</td>
              <td>{{product.name}}</td>
              <td>${{product.price.toFixed(2)}}</td>
              <td>{{product.category}}</td>
              <td>
                <span [class]="getStatusClass(product.status)">
                  {{product.status}}
                </span>
              </td>
              <td>
                <div class="progress" style="height: 20px;">
                  <div 
                    class="progress-bar" 
                    [ngClass]="{
                      'bg-success': product.quantity > 20,
                      'bg-warning': product.quantity > 0 && product.quantity <= 20,
                      'bg-danger': product.quantity === 0
                    }"
                    [style.width.%]="product.quantity ? (product.quantity / 50) * 100 : 0"
                    role="progressbar" 
                    [attr.aria-valuenow]="product.quantity" 
                    aria-valuemin="0" 
                    aria-valuemax="50">
                    {{product.quantity}}
                  </div>
                </div>
              </td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="6" class="text-center p-5">
                <div class="alert alert-info">
                  No products found.
                </div>
              </td>
            </tr>
          </ng-template>
          <ng-template pTemplate="paginatorleft">
            <div class="p-2">
              <button type="button" class="btn btn-outline-secondary btn-sm me-2">
                <i class="pi pi-file-excel"></i> Excel
              </button>
              <button type="button" class="btn btn-outline-secondary btn-sm">
                <i class="pi pi-file-pdf"></i> PDF
              </button>
            </div>
          </ng-template>
          <ng-template pTemplate="paginatorright">
            <div class="p-2">
              <div class="badge bg-info text-white">
                Total Products: {{products.length}}
              </div>
            </div>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>
