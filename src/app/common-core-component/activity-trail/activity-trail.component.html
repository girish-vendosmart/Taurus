<!-- Activity Trail Container -->
<div class="activity-trail-container" role="complementary" [attr.aria-label]="title">
  <!-- Header -->
  <div class="activity-trail-header" *ngIf="showHeader">
    <h3 class="activity-trail-title">{{ title }}</h3>
    <button 
      pButton 
      pRipple 
      type="button" 
      icon="pi pi-refresh" 
      class="p-button-text p-button-sm refresh-btn"
      (click)="refresh()"
      [disabled]="loading"
      [attr.aria-label]="'Refresh ' + title.toLowerCase()"
      pTooltip="Refresh activity trail"
      tooltipPosition="left">
    </button>
  </div>

  <!-- Content -->
  <div class="activity-trail-content" role="log">
    <!-- Loading State -->
    <div class="loading-container" *ngIf="loading" role="status" aria-live="polite">
      <p-progressSpinner 
        [style]="{ width: '28px', height: '28px' }" 
        strokeWidth="4"
        animationDuration="1s"
        aria-label="Loading">
      </p-progressSpinner>
      <span class="loading-text">Loading activity trail...</span>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!loading && processedActivities.length === 0" role="status" aria-live="polite">
      <i class="pi pi-history empty-icon" aria-hidden="true"></i>
      <p class="empty-message">{{ emptyMessage }}</p>
    </div>

    <!-- Activity Timeline -->
    <div class="activity-timeline" *ngIf="!loading && processedActivities.length > 0">
      <div 
        class="activity-item" 
        *ngFor="let activity of processedActivities; trackBy: trackByActivityId; let isFirst = first; let isLast = last"
        role="article">
        
        <!-- Timeline Connector (Left Side) -->
        <div class="timeline-connector">
          <!-- Timeline Line Above Dot (only show if not first item) -->
          <div class="timeline-line timeline-line-top" *ngIf="!isFirst" aria-hidden="true"></div>
          
          <!-- Timeline Dot -->
          <div class="timeline-dot" [ngClass]="getTimelineDotClass(activity.action)" aria-hidden="true">
            <i [class]="getActivityIcon(activity.action)"></i>
          </div>
          
          <!-- Timeline Line Below Dot (only show if not last item) -->
          <div class="timeline-line timeline-line-bottom" *ngIf="!isLast" aria-hidden="true"></div>
        </div>

        <!-- Activity Content Box (Right Side) -->
        <div class="activity-content-box">
          <!-- Activity Badge -->
          <div class="activity-badge" [ngClass]="getActivityBadgeClass(activity.action)">
            {{ getActivityBadgeText(activity.action) }}
          </div>
          
          <!-- Timestamp (top right) -->
          <!-- <div class="activity-timestamp">
            <i class="pi pi-clock" aria-hidden="true"></i>
            <span class="time-since">{{ activity.time_since }}</span>
          </div> -->

          <!-- Activity Description -->
          <div class="activity-description">
            <div class="activity-main-text">
              <i class="pi pi-sync" aria-hidden="true"></i>
              <span>{{ activity.description }}</span>
            </div>
            
            <!-- Data Changes for Data Modified activities -->
            <div class="activity-changes" *ngIf="activity.action === 'Data Modified' && activity.changes && activity.changes.length > 0">
              <div class="change-item" *ngFor="let change of activity.changes">
                <span class="change-indicator" [ngClass]="getChangeIndicator(change)">
                  {{ getChangeSymbol(change) }}
                </span>
                <span class="change-text">{{ formatChangeText(change) }}</span>
              </div>
            </div>
          </div>

          <!-- User Info - Name and Date on same line -->
          <div class="user-info">
            <div class="user-avatar">
              {{ getUserInitials(activity.user) }}
            </div>
            <span class="user-name">{{ activity.user }}</span>
            <time class="activity-time" [attr.datetime]="activity.date | date:'yyyy-MM-ddTHH:mm:ssZ'">
              {{ activity.date | dateFormat }}
            </time>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
