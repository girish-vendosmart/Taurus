<div class="approval-workflow-container">
  <!-- Header -->
  <div class="workflow-header">
    <h3 class="workflow-title">{{ title }}</h3>
  </div>

  <!-- Steps Timeline -->
  <div class="workflow-steps">
    <div 
      *ngFor="let step of steps; trackBy: trackByStepId" 
      class="workflow-step"
      [class.step-completed]="step.status === 'complete'"
      [class.step-active]="step.status === 'in-progress' || step.status === 'ready'"
      [class.step-waiting]="step.status === 'waiting'"
    >
      <!-- Step Icon -->
      <div class="step-icon-container">
        <div class="step-icon" [ngClass]="getStepIconClass(step)">
          <i [class]="getStepIcon(step)"></i>
        </div>
        <div class="step-connector" *ngIf="step !== steps[steps.length - 1]"></div>
      </div>

      <!-- Step Content -->
      <div class="step-content">
        <div class="step-header">
          <h4 class="step-title">{{ step.title }}</h4>
          <button 
            *ngIf="step.status !== 'waiting'"
            type="button"
            pButton
            pRipple
            [label]="getStepButtonText(step)"
            [class]="getStepButtonClass(step)"
            [disabled]="!canCompleteStep(step) || loading"
            (click)="onStepClick(step)"
          ></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Completion Modal -->
  <p-dialog 
    [(visible)]="showCompletionModal"
    [modal]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '500px' }"
    [header]="'Complete ' + (currentStep?.title || 'Step')"
    (onHide)="closeCompletionModal()"
  >
    <div class="completion-modal-content">
      <!-- Photo Upload Section -->
      <div class="form-section" *ngIf="currentStep?.requiresPhotos">
        <label class="form-label required">Upload Evidence</label>
        <div class="file-upload-container" (click)="fileInput.click()">
          <div class="upload-area">
            <i class="pi pi-cloud-upload upload-icon"></i>
            <span class="upload-text">Choose Evidence</span>
          </div>
          <input 
            #fileInput
            type="file"
            multiple
            accept="image/*"
            style="display: none"
            (change)="onFileSelected($event)"
          />
        </div>
        
        <!-- Selected Files Display -->
        <div class="selected-files" *ngIf="selectedFiles.length > 0">
          <div class="file-item" *ngFor="let file of selectedFiles; let i = index">
            <i class="pi pi-file file-icon"></i>
            <span class="file-name">{{ file.name }}</span>
            <span class="file-size">({{ formatFileSize(file.size) }})</span>
            <button 
              type="button"
              class="remove-file-btn"
              (click)="removeFile(i)"
            >
              <i class="pi pi-times"></i>
            </button>
          </div>
        </div>

        <!-- Upload Error -->
        <div class="error-message" *ngIf="uploadError">
          <i class="pi pi-exclamation-triangle"></i>
          {{ uploadError }}
        </div>
      </div>

      <!-- Comments Section -->
      <div class="form-section">
        <label class="form-label" [class.required]="currentStep?.requiresComments">Comments</label>
        <textarea
          pInputTextarea
          [(ngModel)]="completionComments"
          placeholder="Add your comments about this step..."
          rows="4"
          class="w-full"
        ></textarea>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <button 
        type="button"
        pButton 
        label="Cancel"
        class="p-button-text"
        (click)="closeCompletionModal()"
      ></button>
      <button 
        type="button"
        pButton 
        label="Complete Step"
        class="p-button-success"
        [disabled]="!canSubmitCompletion() || loading"
        (click)="onCompleteStep()"
      ></button>
    </ng-template>
  </p-dialog>
</div>
