<div class="google-places-container">
  <p-toast position="top-right"></p-toast>
  
  <div class="location-container">
    <label *ngIf="label" class="location-label">
      {{ label }}
    </label>
    
    <textarea 
      #addressInput
      class="location-textarea" 
      [formControl]="searchControl"
      [(ngModel)]="addressText"
      [placeholder]="placeholder"
      [disabled]="disabled || loadingScript"
      autocomplete="off"
      aria-label="Search for an address"
      rows="2"></textarea>
      
    <!-- <div *ngIf="loadingScript" class="loading-indicator">
      <i class="pi pi-spin pi-spinner"></i> Loading...
    </div> -->
  </div>
  
  <!-- Selected Address Display -->
  <div *ngIf="selectedAddress && selectedAddress.fullAddress" class="selected-address-card">
    <div class="address-title">
      {{ selectedAddress.fullAddress }}
    </div>
    <div class="address-details" *ngIf="selectedAddress.city || selectedAddress.state || selectedAddress.country">
      <div *ngIf="selectedAddress.city || selectedAddress.stateCode || selectedAddress.postalCode">
        {{ selectedAddress.city || '' }}<span *ngIf="selectedAddress.city && (selectedAddress.stateCode || selectedAddress.postalCode)">, </span>{{ selectedAddress.stateCode || '' }}<span *ngIf="selectedAddress.stateCode && selectedAddress.postalCode"> </span>{{ selectedAddress.postalCode || '' }}
      </div>
      <div *ngIf="selectedAddress.country">{{ selectedAddress.country }}</div>
    </div>
    <div class="address-coordinates" *ngIf="selectedAddress.location && selectedAddress.location.lat && selectedAddress.location.lng">
      <i class="pi pi-map-marker"></i> 
      <span class="coordinates-text">{{ selectedAddress.location.lat | number:'1.6-6' }}, {{ selectedAddress.location.lng | number:'1.6-6' }}</span>
    </div>
  </div>
</div>
