<header class="common-header">
  <div class="header-container">
    <div class="header-left">
      <!-- Mobile Menu Toggle -->
      <button 
        type="button" 
        class="mobile-menu-toggle" 
        (click)="onMobileMenuToggle()"
        [class.active]="showMobileMenu">
        <i class="pi pi-bars"></i>
      </button>
      
      <h1 class="header-title">
        <span class="title-full">{{ title }}</span>
        <span class="title-short">Supplier Portal</span>
      </h1>
    </div>
    <div class="header-right">
      <!-- Help section -->
      <div class="profile-link" (click)="onHelp()" *ngIf="shouldShowProfile"> 
        <i class="pi pi-question-circle"></i>
        <span class="link-text">Help</span>
      </div>
      <!-- Profile section -->
      <div class="profile-link" (click)="onProfile()" *ngIf="shouldShowProfile">
        <i class="pi pi-user"></i>
        <span class="link-text">Profile</span>
      </div>
      
      <!-- Notifications section -->
      <div class="notification-dropdown" *ngIf="shouldShowProfile">
        <button type="button" class="notification-button" (click)="toggleNotificationDropdown()">
          <i class="pi pi-bell"></i>
          <span class="notification-badge" *ngIf="unreadNotificationCount > 0">
            {{ unreadNotificationCount > 99 ? '99+' : unreadNotificationCount }}
          </span>
        </button>
        <div class="dropdown-menu notification-menu" [ngClass]="{'show': isNotificationDropdownOpen}">
          <div class="notification-header">
            <h4>Notifications</h4>
            <button 
              type="button" 
              class="mark-all-read-btn" 
              (click)="markAllAsRead()"
              *ngIf="unreadNotificationCount > 0">
              Mark all as read
            </button>
          </div>
          <div class="notification-list">
            <div 
              *ngFor="let notification of sortedNotifications" 
              class="notification-item"
              [ngClass]="{
                'unread': !notification.isRead,
                'notification-info': notification.type === 'info',
                'notification-warning': notification.type === 'warning',
                'notification-success': notification.type === 'success',
                'notification-error': notification.type === 'error'
              }"
              (click)="onNotificationClick(notification)">
              <div class="notification-icon">
                <i class="pi" 
                   [ngClass]="{
                     'pi-info-circle': notification.type === 'info',
                     'pi-exclamation-triangle': notification.type === 'warning',
                     'pi-check-circle': notification.type === 'success',
                     'pi-times-circle': notification.type === 'error'
                   }"></i>
              </div>
              <div class="notification-content">
                <div class="notification-title">{{ notification.title }}</div>
                <div class="notification-message">{{ notification.message }}</div>
                <div class="notification-time">{{ getRelativeTime(notification.timestamp) }}</div>
              </div>
              <div class="notification-status" *ngIf="!notification.isRead">
                <div class="unread-dot"></div>
              </div>
            </div>
          </div>
          <div class="notification-footer" *ngIf="sortedNotifications.length === 0">
            <p>No notifications available</p>
          </div>
        </div>
      </div>
      
      <div class="avatar-dropdown">
        <button type="button" class="avatar-button" (click)="toggleDropdown()">
          <div class="avatar">{{ userInitials }}</div>
        </button>
        <div class="dropdown-menu" [ngClass]="{'show': isDropdownOpen}">
          <button type="button" class="dropdown-item" (click)="onLogout()">
            <i class="pi pi-sign-out"></i>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
