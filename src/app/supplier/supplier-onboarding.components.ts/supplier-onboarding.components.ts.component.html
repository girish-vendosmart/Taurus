<div class="supplier-onboarding-container">
    <div class="header">
      <h1>Supplier Onboarding</h1>
      <p class="lead">Complete the form below to register as a supplier</p>
    </div>
    
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress" [style.width]="((currentStep + 1) / steps.length * 100) + '%'"></div>
      </div>
      <div class="step-indicator">
        Step {{ currentStep + 1 }} of {{ steps.length }}: {{ steps[currentStep].label }}
      </div>
    </div>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="card">
        <div class="card-body">
          <formly-form 
            [form]="form" 
            [fields]="steps[currentStep].fields" 
            [model]="model">
          </formly-form>
        </div>
        
        <div class="card-footer">
          <div class="button-group">
            <button 
              type="button" 
              class="btn btn-secondary" 
              (click)="prevStep()" 
              [disabled]="isFirstStep()">
              Previous
            </button>
            
            <button 
              *ngIf="!isLastStep()" 
              type="button" 
              class="btn btn-primary" 
              (click)="nextStep()">
              Next
            </button>
            
            <button 
              *ngIf="isLastStep()" 
              type="submit" 
              class="btn btn-success">
              Submit
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>
