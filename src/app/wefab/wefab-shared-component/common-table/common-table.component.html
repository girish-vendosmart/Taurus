<div class="table-wrapper">
  <div class="common-table-container">
    <!-- Header with Column Names -->
    <div class="table-header">
      <div class="header-row">
        <div class="header-cell" 
             *ngFor="let col of config.columns"
             [style.width]="col.width"
             [style.flex]="col.width ? 'none' : '1'">
          <span class="header-title">{{ col.header }}</span>
          <i [class]="getSortIcon(col.field)" 
             *ngIf="col.sortable" 
             (click)="sortTable(col.field)"
             [class.active]="currentSortField === col.field && currentSortOrder !== 0"></i>
        </div>
      </div>
      
      <!-- Search Fields Row -->
      <div class="search-row">
        <div class="search-field" 
             *ngFor="let col of config.columns"
             [style.width]="col.width"
             [style.flex]="col.width ? 'none' : '1'">
          <input 
            type="text" 
            pInputText 
            [placeholder]="col.filterable ? 'Search ' + col.header : ''"
            (input)="dt.filter($any($event.target).value, col.field, 'contains')"
            class="search-input"
            [disabled]="!col.filterable"
            *ngIf="col.filterable"
          />
          <div class="no-search" *ngIf="!col.filterable"></div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <p-table 
      #dt 
      [value]="data.length ? data : sampleData"
      [columns]="config.columns"
      [paginator]="config.enablePagination"
      [rows]="config.pageSize || 10"
      [showCurrentPageReport]="config.enablePagination"
      [tableStyle]="{ 'min-width': '100%' }"
      [loading]="loading"
      [globalFilterFields]="globalFilterFields"
      styleClass="p-datatable-sm"
      [rowHover]="true"
      responsiveLayout="scroll"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [alwaysShowPaginator]="false"
      [showFirstLastIcon]="false"
      [showPageLinks]="false"
      [rowsPerPageOptions]="[5, 10, 20, 50]"
    >
      <!-- Custom Pagination Template -->
      <ng-template pTemplate="paginatorright">
        <div class="custom-pagination">
          <button 
            class="pagination-btn" 
            [disabled]="isFirstPage()"
            (click)="goToPreviousPage()">
            Previous
          </button>
          <span class="page-info">
            Page {{ getCurrentPage() }} of {{ getTotalPages() }}
          </span>
          <button 
            class="pagination-btn" 
            [disabled]="isLastPage()"
            (click)="goToNextPage()">
            Next
          </button>
        </div>
      </ng-template>

      <!-- Table Content -->
      <ng-template pTemplate="body" let-rowData>
        <tr (click)="onRowClick($event, rowData)">
          <td *ngFor="let col of config.columns" 
              [ngClass]="col.field + '-column'"
              [style.width]="col.width"
              [style.flex]="col.width ? 'none' : '1'">
            <ng-container [ngSwitch]="true">
              <!-- Company Cell -->
              <div class="company-cell" *ngSwitchCase="col.isLink">
                <a class="company-name" 
                   *ngIf="!col.routerLink && !rowData.routerLink"
                   (click)="onLinkClick($event, rowData, col)">
                  {{ rowData[col.field] }}
                </a>
                <a class="company-name" 
                   *ngIf="col.routerLink && !rowData.routerLink"
                   [routerLink]="getRouterLink(col, rowData)"
                   (click)="onLinkClick($event, rowData, col)">
                  {{ rowData[col.field] }}
                </a>
                <a class="company-name" 
                   *ngIf="rowData.routerLink"
                   [routerLink]="rowData.routerLink"
                   (click)="onLinkClick($event, rowData, col)">
                  {{ rowData[col.field] }}
                </a>
                <span class="company-id" *ngIf="rowData.companyId">{{ rowData.companyId }}</span>
              </div>

              <!-- Status Cell -->
              <div class="status-cell" *ngSwitchCase="col.isStatus">
                <span [class]="'status-badge ' + getStatusClass(rowData[col.field])">
                  {{ rowData[col.field] }}
                </span>
              </div>

              <!-- Action Cell -->
              <div class="action-cell" *ngSwitchCase="col.isAction">
                <button 
                  type="button" 
                  [class]="'action-btn ' + (btn.class || '') + ' ' + getSeverityClass(btn.severity)"
                  (click)="onActionClick(btn.action, rowData, $event)"
                  [title]="btn.tooltip || btn.label"
                  *ngFor="let btn of getActionButtons()">
                  <i [class]="btn.icon" *ngIf="btn.icon"></i>
                  <span *ngIf="!btn.iconOnly && btn.label">{{ btn.label }}</span>
                </button>
              </div>

              <!-- Default Cell -->
              <div [class]="col.field + '-cell'" *ngSwitchDefault>
                {{ rowData[col.field] }}
              </div>
            </ng-container>
          </td>
        </tr>
      </ng-template>

      <!-- Empty State -->
      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="config.columns.length" class="text-center p-4">
            No records found.
          </td>
        </tr>
      </ng-template>

      <!-- Loading State -->
      <ng-template pTemplate="loadingbody">
        <tr>
          <td [attr.colspan]="config.columns.length" class="text-center p-4">
            Loading data...
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
