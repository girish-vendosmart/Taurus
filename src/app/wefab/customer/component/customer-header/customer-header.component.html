<header class="customer-header">
  <div class="header-container">
    <div class="header-left">
      <!-- Mobile Menu Toggle -->
      <button 
        type="button" 
        class="mobile-menu-toggle" 
        (click)="onMobileMenuToggle()"
        [class.active]="showMobileMenu">
        <i class="pi pi-bars"></i>
      </button>
    </div>
    
    <div class="header-right">
      <!-- Help section -->
      <div class="header-action" (click)="onHelp()" title="Help"> 
        <i class="pi pi-question-circle"></i>
        <span class="action-text">Help</span>
      </div>
      
      <!-- Notifications section -->
      <div class="notification-dropdown">
        <button type="button" class="notification-button" (click)="toggleNotificationDropdown()" title="Notifications">
          <i class="pi pi-bell"></i>
          <span class="notification-badge" *ngIf="unreadNotificationCount > 0">
            {{ unreadNotificationCount > 99 ? '99+' : unreadNotificationCount }}
          </span>
        </button>
        <div class="dropdown-menu notification-menu" [ngClass]="{'show': isNotificationDropdownOpen}">
          <div class="notification-header">
            <h4>Notifications</h4>
            <button 
              type="button" 
              class="mark-all-read-btn" 
              (click)="markAllAsRead()"
              *ngIf="unreadNotificationCount > 0">
              Mark all as read
            </button>
          </div>
          <div class="notification-list">
            <div 
              *ngFor="let notification of sortedNotifications" 
              class="notification-item"
              [ngClass]="{
                'unread': !notification.isRead,
                'notification-info': notification.type === 'info',
                'notification-warning': notification.type === 'warning',
                'notification-success': notification.type === 'success',
                'notification-error': notification.type === 'error'
              }"
              (click)="onNotificationClick(notification)">
              <div class="notification-icon">
                <i class="pi" 
                   [ngClass]="{
                     'pi-info-circle': notification.type === 'info',
                     'pi-exclamation-triangle': notification.type === 'warning',
                     'pi-check-circle': notification.type === 'success',
                     'pi-times-circle': notification.type === 'error'
                   }"></i>
              </div>
              <div class="notification-content">
                <div class="notification-title">{{ notification.title }}</div>
                <div class="notification-message">{{ notification.message }}</div>
                <div class="notification-time">{{ getRelativeTime(notification.timestamp) }}</div>
              </div>
              <div class="notification-status" *ngIf="!notification.isRead">
                <div class="unread-dot"></div>
              </div>
            </div>
          </div>
          <div class="notification-footer" *ngIf="sortedNotifications.length === 0">
            <p>No notifications available</p>
          </div>
        </div>
      </div>
      
      <!-- User Profile Dropdown -->
      <div class="user-dropdown">
        <button type="button" class="user-button" (click)="toggleUserDropdown()" title="User Menu">
          <div class="user-avatar">
            <img *ngIf="userProfileImage; else initials" [src]="userProfileImage" alt="User Profile" class="avatar-image">
            <ng-template #initials>
              <span class="avatar-initials">{{ userInitials }}</span>
            </ng-template>
          </div>
          <div class="user-info">
            <span class="user-name">{{ userName }}</span>
            <span class="user-role">Customer</span>
          </div>
          <i class="pi pi-chevron-down dropdown-arrow"></i>
        </button>
        <div class="dropdown-menu user-menu" [ngClass]="{'show': isUserDropdownOpen}">
          <div class="user-profile-section">
            <div class="profile-avatar">
              <img *ngIf="userProfileImage; else profileInitials" [src]="userProfileImage" alt="User Profile" class="profile-image">
              <ng-template #profileInitials>
                <span class="profile-initials">{{ userInitials }}</span>
              </ng-template>
            </div>
            <div class="profile-details">
              <div class="profile-name">{{ userName }}</div>
              <div class="profile-email">{{ userEmail }}</div>
            </div>
          </div>
          <hr class="dropdown-divider">
          <button type="button" class="dropdown-item" (click)="onProfile()">
            <i class="pi pi-user"></i>
            <span>My Profile</span>
          </button>
          <button type="button" class="dropdown-item" (click)="onSettings()">
            <i class="pi pi-cog"></i>
            <span>Settings</span>
          </button>
          <button type="button" class="dropdown-item" (click)="onBilling()">
            <i class="pi pi-credit-card"></i>
            <span>Billing</span>
          </button>
          <hr class="dropdown-divider">
          <button type="button" class="dropdown-item logout-item" (click)="onLogout()">
            <i class="pi pi-sign-out"></i>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
