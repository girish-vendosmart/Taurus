<div class="quotation-page">
  <div class="content-section">
    <!-- Common Table Component -->
    <div class="table-section">
      <app-common-table 
        [config]="tableConfig" 
        [data]="allQuotations"
        [loading]="loading"
        (rowClick)="onRowClick($event)"
        (linkClick)="onLinkClick($event)"
        (actionClick)="onActionClick($event)">
      </app-common-table>
    </div>
  </div>
</div>
