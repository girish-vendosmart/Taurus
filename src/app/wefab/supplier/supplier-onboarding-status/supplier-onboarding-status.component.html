<div class="onboarding-status-container">
  <div class="onboarding-status-card">
    <div class="header-section">
      <h1>Supplier Onboarding</h1>
      <p class="subtitle">
        Track your progress through our supplier onboarding process. Complete all three levels to finalize your registration.
      </p>
    </div>

    <div class="progress-overview">
      <div class="progress-header">
        <span class="progress-label">Overall Progress</span>
        <span class="progress-percentage">{{ overallProgress }}%</span>
      </div>
      <div class="progress-bar">
        <div class="progress" [style.width.%]="overallProgress"></div>
      </div>
    </div>

    <div class="steps-container">
      <div *ngFor="let step of onboardingSteps" class="step-card" [ngClass]="{ 
        'completed': step.status === 'completed',
        'in-progress': step.status === 'in-progress',
        'pending': step.status === 'pending',
        'locked': step.status === 'locked'
      }">
        <div class="step-content">
          <div class="step-icon">
            <ng-container [ngSwitch]="step.icon">
              <svg *ngSwitchCase="'check'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <svg *ngSwitchCase="'clock'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <div *ngSwitchDefault class="step-number">{{ step.id }}</div>
            </ng-container>
          </div>

          <div class="step-details">
            <h3 class="step-title">{{ step.title }}</h3>
            <p class="step-description">{{ step.description }}</p>
          </div>

          <div class="step-status">
            <span class="status-badge" *ngIf="step.status === 'completed'">Approved</span>
            <span class="status-badge" *ngIf="step.status === 'in-progress'">Under Review</span>
            <span class="status-badge" *ngIf="step.status === 'pending'">Not Started</span>
            <span class="status-badge" *ngIf="step.status === 'locked'">Locked</span>
          </div>
        </div>

        <div class="step-actions">
          <button *ngIf="step.status === 'completed'" class="secondary-button" (click)="viewDetails(step.id)">
            View Details
          </button>
          <button *ngIf="step.status === 'in-progress'" class="primary-button" (click)="continueOnboarding(step.id)">
            Continue <span class="arrow">→</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
