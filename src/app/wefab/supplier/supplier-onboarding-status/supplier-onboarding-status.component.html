<div class="onboarding-status-container">
  <div class="onboarding-status-card">
    <div class="header-section">
      <h1>Supplier Onboarding</h1>
      <p class="subtitle">
        Track your progress through our supplier onboarding process. Complete all three
        levels to finalize your registration.
      </p>
    </div>

    <div class="progress-overview">
      <div class="progress-header">
        <span class="progress-label">Profile Completeness</span>
        <span class="progress-percentage">{{ overallProgress }}%</span>
      </div>
      <div class="progress-bar">
        <div class="progress" [style.width.%]="overallProgress"></div>
      </div>
    </div>

    <div class="steps-container">
      <div *ngFor="let step of onboardingSteps" class="step-card" [ngClass]="step.color">
        <div class="step-content">
          <div class="step-icon">
            <i [ngClass]="step.icon"></i>
          </div>

          <div class="step-details">
            <h3 class="step-title">{{ step.title }}</h3>
            <p class="step-description">{{ step.description }}</p>
          </div>

          <div class="step-status">
            <span class="status-badge">{{ getStatusLabel(step.status) }}</span>
          </div>
        </div>

        <div class="step-actions">
          <!-- Edit button for in-progress sections -->
          <button *ngIf="step.status === 'in-progress' && !hasPreviousSectionRejected(step.id)" 
                  class="secondary-button" 
                  (click)="viewDetails(step)">
            Edit
          </button>
          
          <!-- Update button for request-to-update sections -->
          <button *ngIf="step.status === 'request-to-update'" 
                  class="primary-button" 
                  (click)="viewDetails(step)">
            Update
          </button>
          
          <!-- Start button for pending sections that are the next to fill AND no rejected sections exist -->
          <button *ngIf="step.status === 'pending' && step.id === nextSectionToFill && !hasRejectedSections()" 
                  class="primary-button" 
                  (click)="continueOnboarding(step.id)">
            Continue
          </button>
        </div>
      </div>
    </div>
    
    <!-- Global Profile Review Button when any section is under review -->
    <div *ngIf="shouldShowProfileReviewButton()" class="global-actions">
      <button class="primary-button profile-review-button" (click)="goToProfileReview()">
        View Profile
      </button>
    </div>
  </div>
</div>
