<div class="supplier-layout">
  <!-- Common Sidebar Component - only show when dashboard layout is enabled -->
  <app-common-sidebar 
    *ngIf="showDashboardLayout"
    [menuItems]="sidebarMenuItems"
    [visible]="true"
    [showHeader]="true"
    headerTitle="WE-FAB Supplier Portal"
    width="260px">
  </app-common-sidebar>

  <!-- Main content area -->
  <div class="main-content" [class.with-sidebar]="showDashboardLayout">
    <!-- Common Header Component - only show when dashboard layout is enabled -->
    <app-common-header 
      [title]="''"
      (logoutEvent)="onHeaderLogout()">
    </app-common-header>

    <!-- Router outlet for all content -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
